name: Retirar versión anterior

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/privacy-cleanup.yml'

permissions:
  contents: write

jobs:
  remove-old-release:
    runs-on: ubuntu-latest
    steps:
      - name: Eliminar versión de escritorio con datos anteriores
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete v0.1.0 --repo ${{ github.repository }} --cleanup-tag --yes || true
